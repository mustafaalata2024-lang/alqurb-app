<div class="card">

<h2>📝 المسابقة الإسلامية</h2>

<input id="name" placeholder="اكتب اسمك هنا">

<br><br>

<div id="quiz"></div>

<button onclick="nextQuestion()">السؤال التالي</button>

<h3 id="result"></h3>

</div>


<script>

let questions = [

{
q:"كم عدد أركان الإسلام؟",
a:["3","5","7"],
correct:1
},

{
q:"ما أول سورة في القرآن الكريم؟",
a:["الفاتحة","البقرة","الإخلاص"],
correct:0
},

{
q:"كم عدد الصلوات المفروضة؟",
a:["3","5","6"],
correct:1
},

{
q:"ما اسم شهر الصيام؟",
a:["رمضان","شعبان","محرم"],
correct:0
},

{
q:"ما هو كتاب المسلمين؟",
a:["التوراة","القرآن الكريم","الإنجيل"],
correct:1
},

{
q:"من هو خاتم الأنبياء؟",
a:["موسى عليه السلام","عيسى عليه السلام","محمد ﷺ"],
correct:2
},

{
q:"كم عدد أجزاء القرآن الكريم؟",
a:["20","30","40"],
correct:1
},

{
q:"ما هي قبلة المسلمين؟",
a:["المسجد النبوي","الكعبة","المسجد الأقصى"],
correct:1
},

{
q:"ما أول أركان الإسلام؟",
a:["الصلاة","الشهادة","الزكاة"],
correct:1
},

{
q:"في أي شهر يكون الحج؟",
a:["رمضان","ذو الحجة","رجب"],
correct:1
}

];


let current=0;
let score=0;


function showQuestion(){

let q=questions[current];

let html="<h3>"+(current+1)+"- "+q.q+"</h3>";

q.a.forEach((x,i)=>{

html+=`
<label>
<input type="radio" name="answer" value="${i}">
${x}
</label><br><br>
`;

});


document.getElementById("quiz").innerHTML=html;

}



function nextQuestion(){

let name=document.getElementById("name").value;

if(name==""){
alert("اكتب اسمك أولاً");
return;
}


let answer=document.querySelector('input[name="answer"]:checked');


if(!answer){
alert("اختر إجابة");
return;
}


if(Number(answer.value)==questions[current].correct){
score++;
}


current++;


if(current < questions.length){

showQuestion();

}

else{

document.getElementById("quiz").innerHTML="انتهى الاختبار 🎉";

document.getElementById("result").innerHTML=
name+" نتيجتك: "+score+" من "+questions.length;

}

}


showQuestion();

  </script>

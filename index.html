<div class="card">

<h2>📝 المسابقة الإسلامية</h2>

<div id="quiz"></div>

<button onclick="nextQuestion()">السؤال التالي</button>

<h3 id="result"></h3>

</div>


<script>

let questions = [
{
q:"كم عدد أركان الإسلام؟",
a:["3","5","7"],
correct:1
},

{
q:"ما أول سورة في القرآن الكريم؟",
a:["الفاتحة","البقرة","الناس"],
correct:0
},

{
q:"كم عدد الصلوات المفروضة في اليوم؟",
a:["3","5","7"],
correct:1
}
];


let current=0;
let score=0;


function showQuestion(){

let q=questions[current];

let html=
"<h3>"+q.q+"</h3>";

q.a.forEach((x,i)=>{

html+=`
<label>
<input type="radio" name="answer" value="${i}">
${x}
</label><br>
`;

});

document.getElementById("quiz").innerHTML=html;

}


function nextQuestion(){

let answer=document.querySelector('input[name="answer"]:checked');

if(!answer){
alert("اختر إجابة أولاً");
return;
}

if(Number(answer.value)==questions[current].correct){
score++;
}


current++;


if(current<questions.length){

showQuestion();

}else{

document.getElementById("quiz").innerHTML="انتهى الاختبار";

document.getElementById("result").innerHTML=
"درجتك: "+score+" من "+questions.length;

}

}


showQuestion();

</script>
